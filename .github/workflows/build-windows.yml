name: Build Windows exe

on:
  push:
    tags: ["v*"]          # e.g. git tag v0.1.0 && git push origin v0.1.0
  workflow_dispatch:       # or run manually from the Actions tab

permissions:
  contents: write          # needed to attach the exe to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Install optional Assimp support
        continue-on-error: true
        run: pip install assimp-py

      - name: Build exe
        run: pyinstaller --noconfirm --clean gleek3deek.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Gleek3Deek-windows
          path: dist/Gleek3Deek.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Gleek3Deek.exe
